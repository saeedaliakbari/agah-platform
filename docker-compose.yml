services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agah_platform
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agah_platform_test
    ports:
      - "5433:5432"
      
volumes:
  db_data: